<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>量子階塔（Quantum Spire）模擬系統 - 清晰版</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        /* --- 全域設定：調整為較亮的深藍紫色背景 --- */
        body { 
            /* 背景稍微調亮，保留神祕感但減少壓迫感 */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #243b55 100%);
            min-height: 100vh;
            padding-bottom: 80px; 
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif; 
            color: #ffffff; /* 預設文字全白 */
        }
        
        /* --- 卡片樣式：降低透明度，提高對比 --- */
        .dashboard-card, .card { 
            border: 2px solid rgba(255, 255, 255, 0.15); /* 邊框加粗 */
            border-radius: 16px; 
            /* 背景顏色加深且不透明度提高，讓文字更浮出 */
            background: rgba(30, 30, 40, 0.85); 
            backdrop-filter: blur(10px); 
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); 
            margin-bottom: 20px; 
            color: #fff;
        }

        /* 標題與文字調整：加大字體，改用亮白色 */
        .stat-label { 
            font-size: 1.1rem; /* 加大 */
            color: #e0e0e0; /* 亮灰白 */
            font-weight: 700; 
            letter-spacing: 1px; 
        }
        .stat-value { 
            font-size: 2.2rem; /* 加大 */
            font-weight: 800; 
            color: #FFD700; 
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); 
        }
        .stat-ntd { 
            font-size: 1.3rem; /* 加大 */
            color: #4cd137; 
            font-weight: bold; 
        }
        
        /* --- 輸入框優化：高對比模式 --- */
        .form-control, .form-select {
            background-color: rgba(255, 255, 255, 0.1); /* 淺色半透明底 */
            border: 2px solid rgba(255, 255, 255, 0.4); /* 明顯邊框 */
            color: #fff;
            font-size: 1.2rem; /* 輸入字體加大 */
            font-weight: bold;
        }
        .form-control:focus {
            background-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            border-color: #FFD700;
            box-shadow: 0 0 0 0.25rem rgba(255, 215, 0, 0.25);
        }
        .form-control::placeholder { color: #bbb; } /* 提示字改亮 */

        /* --- 左右區塊 (增強辨識度) --- */
        .zone-card { height: 100%; transition: transform 0.2s; }
        .zone-left { 
            background: linear-gradient(180deg, rgba(13, 110, 253, 0.15) 0%, rgba(30, 30, 40, 0.9) 100%);
            border-top: 6px solid #4dabf7; /* 頂部線條加粗 */
        }
        .zone-right { 
            background: linear-gradient(180deg, rgba(255, 193, 7, 0.15) 0%, rgba(30, 30, 40, 0.9) 100%);
            border-top: 6px solid #ffc107; /* 頂部線條加粗 */
        }
        
        /* 標題字體加大 */
        .zone-title-L { color: #6ec2ff; font-weight: 900; font-size: 1.6rem; text-shadow: 1px 1px 2px black; }
        .zone-title-R { color: #ffca2c; font-weight: 900; font-size: 1.6rem; text-shadow: 1px 1px 2px black; }

        /* 積分顯示：超大字體 */
        .point-display { font-size: 3rem; font-weight: 800; text-align: center; margin: 10px 0; letter-spacing: 2px; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
        .point-label { text-align: center; font-size: 1rem; color: #ddd; letter-spacing: 1px; font-weight: bold; }

        /* M2 專用輸入格 */
        .gen-input-group { margin-bottom: 12px; }
        .gen-label { 
            width: 60px; /* 加寬 */
            text-align: center; font-weight: bold; font-size: 1rem; /* 加大 */
            display: flex; align-items: center; justify-content: center; 
            background: rgba(255,255,255,0.2); 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-right: none; 
            color: #fff;
            border-radius: 4px 0 0 4px; 
        }
        
        /* 紀錄表格優化 */
        .table { --bs-table-bg: transparent; color: #fff; font-size: 1.1rem; }
        .table-light { --bs-table-bg: rgba(255,255,255,0.2); --bs-table-color: #fff; border-color: rgba(255,255,255,0.2); font-weight: bold;}
        .table-striped>tbody>tr:nth-of-type(odd)>* { --bs-table-accent-bg: rgba(255,255,255,0.05); color: #fff; }
        .table-hover>tbody>tr:hover>* { --bs-table-accent-bg: rgba(255,255,255,0.15); color: #fff; }
        
        .log-earn { color: #ff80cc; font-weight: bold; font-size: 1.2rem; }

        /* 對碰區塊 */
        .match-zone { 
            background: linear-gradient(45deg, #2b2b2b, #4a4a4a); 
            border: 2px solid rgba(255,255,255,0.3);
            color: white; border-radius: 16px; padding: 30px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        }

        /* --- S級特效樣式 --- */
        @keyframes goldShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .rank-S {
            /* 金色流光 */
            background: linear-gradient(45deg, #FFD700, #FDB931, #fffacd, #FDB931, #FFD700);
            background-size: 300% 300%;
            color: #5c3a00 !important;
            border: 2px solid #fff;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: goldShine 3s ease infinite;
            font-size: 1.3rem !important;
            padding: 8px 20px !important;
            text-shadow: none;
        }
        
        /* 區隔線顏色 */
        hr { border-color: rgba(255,255,255,0.4); opacity: 1; margin: 1.5rem 0; }
        
        /* 顏色增強 */
        .text-primary { color: #6ec2ff !important; } /* 更亮的藍 */
        .border-primary { border-color: #6ec2ff !important; }
        .text-warning-emphasis { color: #ffca2c !important; } /* 更亮的黃 */
        .border-warning { border-color: #ffca2c !important; }
        .text-success { color: #5eff5e !important; } /* 更亮的綠 */
        .text-info { color: #0dcaf0 !important; }
        
        /* 按鈕樣式：加大按鈕 */
        .btn { font-size: 1.1rem; font-weight: bold; padding: 10px 20px; }
        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
        .btn-warning { background-color: #ffc107; color: #000; font-weight: 900; }
        .btn-outline-primary { color: #6ec2ff; border-color: #6ec2ff; border-width: 2px; }
        .btn-outline-primary:hover { background-color: #6ec2ff; color: #000; }
        .btn-outline-warning { color: #ffca2c; border-color: #ffca2c; border-width: 2px; }
        .btn-outline-warning:hover { background-color: #ffca2c; color: #000; }

        /* 輸入框內的文字 */
        input::placeholder { font-size: 0.9rem; }

    </style>
</head>
<body>

<div class="container mt-4" style="max-width: 1100px;">
    
    <!-- 儀表板 -->
    <div class="dashboard-card p-4">
        <div class="row align-items-center">
            <div class="col-md-3 border-end border-secondary">
                <div class="stat-label">您的角色 (P)</div>
                <div class="d-flex align-items-center mt-2">
                    <input type="number" id="p_level" class="form-control me-2 text-center" value="1" min="1" max="31" style="width: 100px; font-weight:900; font-size:1.5rem;" onchange="updateSystemState()">
                    <span id="p_rank_badge" class="badge bg-secondary fs-5 p-2">D級</span>
                </div>
                <div class="mt-2" style="font-size: 1.1rem; color: #ddd;">總成本: <span id="cost_display" class="text-white fw-bold">$3,813</span></div>
            </div>
            <div class="col-md-5 border-end border-secondary text-center">
                <div class="stat-label">目前累積總收益 (Total Earned)</div>
                <div class="stat-value" id="total_coin">0.00 B</div>
                <div class="stat-ntd" id="total_ntd">NT$ 0</div>
            </div>
            <div class="col-md-4 px-4">
                <div class="d-flex justify-content-between mb-1">
                    <span class="stat-label">回本進度 (ROI)</span>
                    <span class="fw-bold text-info fs-4" id="roi_text">0%</span>
                </div>
                <div class="progress" style="height: 25px; background-color: rgba(255,255,255,0.2);">
                    <div id="roi_bar" class="progress-bar progress-bar-striped progress-bar-animated bg-info" role="progressbar" style="width: 0%"></div>
                </div>
                <button class="btn btn-outline-danger w-100 mt-3" onclick="resetSystem()">🔄 重置系統</button>
            </div>
        </div>
    </div>

    <div class="row g-4">
        
        <!-- 左區 -->
        <div class="col-md-6">
            <div class="card zone-card zone-left shadow-sm">
                <div class="card-body">
                    <div class="text-center mb-2 zone-title-L">⬅️ 左區 (Left)</div>
                    <div class="point-label">累積積分</div>
                    <div class="point-display text-primary" id="left_points">0</div>
                    <hr>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-primary fs-5">1. 新增直推 (M1)</label>
                        <div class="input-group">
                            <input type="number" id="m1_input_L" class="form-control border-primary" placeholder="輸入等級">
                            <button class="btn btn-primary" onclick="addM1('L')">➕ 加入左區</button>
                        </div>
                    </div>

                    <div class="mb-4 p-3 rounded border border-primary-subtle" style="background: rgba(13, 110, 253, 0.1);">
                        <label class="form-label fw-bold text-success fs-5">2. 代數批量 (M2)</label>
                        <div class="row g-2">
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">2代</span><input type="number" id="m2_g2_L" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">3代</span><input type="number" id="m2_g3_L" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">4代</span><input type="number" id="m2_g4_L" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">5代</span><input type="number" id="m2_g5_L" class="form-control form-control-sm" placeholder="等級"></div></div>
                        </div>
                        <button class="btn btn-success w-100 mt-2" onclick="addM2Batch('L')">➕ 批量加入左區 (賺3%)</button>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-secondary fs-5" style="color: #ccc !important;">3. 來自安置 (純積分)</label>
                        <div class="input-group">
                            <input type="number" id="place_input_L" class="form-control" placeholder="輸入等級">
                            <button class="btn btn-outline-primary" onclick="addPlacement('L')">僅加積分</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右區 -->
        <div class="col-md-6">
            <div class="card zone-card zone-right shadow-sm">
                <div class="card-body">
                    <div class="text-center mb-2 zone-title-R">➡️ 右區 (Right)</div>
                    <div class="point-label">累積積分</div>
                    <div class="point-display text-warning-emphasis" id="right_points">0</div>
                    <hr>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-warning-emphasis fs-5">1. 新增直推 (M1)</label>
                        <div class="input-group">
                            <input type="number" id="m1_input_R" class="form-control border-warning" placeholder="輸入等級">
                            <button class="btn btn-warning" onclick="addM1('R')">➕ 加入右區</button>
                        </div>
                    </div>

                    <div class="mb-4 p-3 rounded border border-warning-subtle" style="background: rgba(255, 193, 7, 0.1);">
                        <label class="form-label fw-bold text-success fs-5">2. 代數批量 (M2)</label>
                        <div class="row g-2">
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">2代</span><input type="number" id="m2_g2_R" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">3代</span><input type="number" id="m2_g3_R" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">4代</span><input type="number" id="m2_g4_R" class="form-control form-control-sm" placeholder="等級"></div></div>
                            <div class="col-6"><div class="input-group gen-input-group"><span class="gen-label">5代</span><input type="number" id="m2_g5_R" class="form-control form-control-sm" placeholder="等級"></div></div>
                        </div>
                        <button class="btn btn-success w-100 mt-2" onclick="addM2Batch('R')">➕ 批量加入右區 (賺3%)</button>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-bold text-secondary fs-5" style="color: #ccc !important;">3. 來自安置 (純積分)</label>
                        <div class="input-group">
                            <input type="number" id="place_input_R" class="form-control" placeholder="輸入等級">
                            <button class="btn btn-outline-warning" onclick="addPlacement('R')">僅加積分</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 對碰區 -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="match-zone text-center">
                <h3 class="fw-bold fs-2" style="text-shadow: 0 0 15px rgba(255,255,255,0.3);">⚡ M3 雙軌對碰結算 ⚡</h3>
                <p class="text-light fs-5">取左右兩區較小值 (t) 進行計算，兩邊扣除 t 後，大邊餘額保留。</p>
                <button class="btn btn-danger btn-lg px-5 shadow fw-bold mt-2" style="font-size: 1.8rem; border: 2px solid rgba(255,255,255,0.5); padding: 15px 50px;" onclick="executeMatch()">💥 立即執行對碰</button>
            </div>
        </div>
    </div>

    <!-- 紀錄 -->
    <div class="card mt-4 shadow-sm">
        <div class="card-header bg-transparent border-bottom border-secondary fw-bold text-white fs-5">📋 收益與操作紀錄</div>
        <div class="card-body p-0">
            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                <table class="table table-striped table-hover mb-0 log-table align-middle">
                    <thead class="table-light sticky-top">
                        <tr>
                            <th scope="col" style="width: 8%">#</th>
                            <th scope="col" style="width: 12%">類型</th>
                            <th scope="col" style="width: 45%">描述</th>
                            <th scope="col" style="width: 20%">積分變動</th>
                            <th scope="col" style="width: 15%">獲得獎金 (B)</th>
                        </tr>
                    </thead>
                    <tbody id="log_body">
                        <!-- Javascript 將在此插入紀錄 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    // --- 系統參數與狀態 ---
    const RATE_NTD = 31;
    const PRICE_PER_UNIT = 123;
    const S_RANK_THRESHOLD = 10000; // S級門檻
    
    let state = {
        totalCoins: 0,
        leftPoints: 0,
        rightPoints: 0,
        logCount: 0,
        hasCelebratedS: false // 是否已經慶祝過S級
    };

    // 初始化
    updateSystemState();

    // --- 輔助函式 ---

    // 取得層級與參數
    function getRankInfo(level) {
        level = parseInt(level) || 0;
        if (level >= 31) return { rank: "A", m1: 0.15, m3: 0.11, class: "bg-danger" };
        if (level >= 21) return { rank: "B", m1: 0.14, m3: 0.10, class: "bg-warning text-dark" };
        if (level >= 11) return { rank: "C", m1: 0.12, m3: 0.09, class: "bg-success" };
        return { rank: "D", m1: 0.10, m3: 0.08, class: "bg-secondary" };
    }

    // 觸發灑花慶祝
    function triggerConfetti() {
        var duration = 3 * 1000;
        var end = Date.now() + duration;

        (function frame() {
            confetti({
                particleCount: 5,
                angle: 60,
                spread: 55,
                origin: { x: 0 },
                colors: ['#FFD700', '#FF0000', '#FFFFFF']
            });
            confetti({
                particleCount: 5,
                angle: 120,
                spread: 55,
                origin: { x: 1 },
                colors: ['#FFD700', '#FF0000', '#FFFFFF']
            });

            if (Date.now() < end) {
                requestAnimationFrame(frame);
            }
        }());
    }

    // 更新畫面顯示 (含 S 級判斷)
    function updateSystemState() {
        let pLevel = parseInt(document.getElementById("p_level").value) || 1;
        let info = getRankInfo(pLevel);
        let badge = document.getElementById("p_rank_badge");
        
        // -------------------------
        // S級 核心判斷邏輯
        // -------------------------
        if (state.totalCoins >= S_RANK_THRESHOLD) {
            badge.className = "badge rank-S"; // 套用金色樣式
            badge.innerHTML = "S級 ★";      // 加上星星

            if (!state.hasCelebratedS) {
                triggerConfetti();
                state.hasCelebratedS = true; 
                addLog("🏆 晉升 S級", "累積獎金突破 10,000 B！獲得榮耀徽章！", "-", 0);
            }
        } else {
            badge.className = "badge fs-5 p-2 " + info.class; // 加大徽章
            badge.innerText = info.rank + "級";
            state.hasCelebratedS = false; 
        }

        // 2. 成本
        let cost = pLevel * PRICE_PER_UNIT * RATE_NTD;
        document.getElementById("cost_display").innerText = "$" + cost.toLocaleString();

        // 3. 積分
        document.getElementById("left_points").innerText = state.leftPoints;
        document.getElementById("right_points").innerText = state.rightPoints;

        // 4. 收益與 ROI
        let totalNTD = Math.round(state.totalCoins * RATE_NTD);
        document.getElementById("total_coin").innerText = state.totalCoins.toFixed(2) + " B";
        document.getElementById("total_ntd").innerText = "NT$ " + totalNTD.toLocaleString();

        let roi = (cost > 0) ? (totalNTD / cost) * 100 : 0;
        let roiBar = document.getElementById("roi_bar");
        let roiText = document.getElementById("roi_text");
        
        roiText.innerText = roi.toFixed(1) + "%";
        roiBar.style.width = Math.min(roi, 100) + "%"; 
        
        if (roi >= 100) {
            roiBar.className = "progress-bar progress-bar-striped progress-bar-animated bg-success";
            roiText.className = "fw-bold text-success";
        } else {
            roiBar.className = "progress-bar progress-bar-striped progress-bar-animated bg-info";
            roiText.className = "fw-bold text-info";
        }
    }

    // 寫入紀錄
    function addLog(type, desc, pointChange, earnB) {
        state.logCount++;
        let tbody = document.getElementById("log_body");
        let row = document.createElement("tr");
        
        let earnClass = earnB > 0 ? "log-earn" : "text-white-50";
        let earnText = earnB > 0 ? `+${earnB.toFixed(2)}` : "-";

        row.innerHTML = `
            <th scope="row">${state.logCount}</th>
            <td><span class="badge bg-secondary border border-secondary text-white fs-6">${type}</span></td>
            <td class="fs-6">${desc}</td>
            <td class="fs-6">${pointChange}</td>
            <td class="${earnClass}">${earnText}</td>
        `;
        tbody.insertBefore(row, tbody.firstChild);
    }

    // --- 核心邏輯 (支援左右參數 side: 'L' or 'R') ---

    // 1. M1 直推
    function addM1(side) {
        let inputId = `m1_input_${side}`;
        let input = document.getElementById(inputId);
        let tLevel = parseInt(input.value);
        
        if (!tLevel || tLevel <= 0) return alert("請輸入正確等級");

        let pLevel = document.getElementById("p_level").value;
        let info = getRankInfo(pLevel);
        let bonus = 73.8 * tLevel * info.m1;
        
        // 更新狀態
        state.totalCoins += bonus;
        if (side === 'L') {
            state.leftPoints += tLevel;
            addLog("M1 直推 (左)", `左區直推等級 ${tLevel} (比例 ${Math.round(info.m1*100)}%)`, `<span class="text-primary">+${tLevel} 左</span>`, bonus);
        } else {
            state.rightPoints += tLevel;
            addLog("M1 直推 (右)", `右區直推等級 ${tLevel} (比例 ${Math.round(info.m1*100)}%)`, `<span class="text-warning-emphasis">+${tLevel} 右</span>`, bonus);
        }

        input.value = "";
        updateSystemState();
    }

    // 2. M2 代數批量
    function addM2Batch(side) {
        let sideText = (side === 'L') ? "左" : "右";
        let pointClass = (side === 'L') ? "text-primary" : "text-warning-emphasis";
        
        const fields = [
            { id: `m2_g2_${side}`, gen: 2 },
            { id: `m2_g3_${side}`, gen: 3 },
            { id: `m2_g4_${side}`, gen: 4 },
            { id: `m2_g5_${side}`, gen: 5 }
        ];

        let hasData = false;

        fields.forEach(field => {
            let el = document.getElementById(field.id);
            let val = parseInt(el.value);

            if (val && val > 0) {
                hasData = true;
                let bonus = 73.8 * val * 0.03; // 固定 3%
                
                state.totalCoins += bonus;
                if (side === 'L') state.leftPoints += val;
                else state.rightPoints += val;

                addLog(`M2 代數 (${sideText})`, `${sideText}區新增等級 ${val} (${field.gen}代)`, `<span class="${pointClass}">+${val} ${sideText}</span>`, bonus);
                el.value = "";
            }
        });

        if (hasData) {
            updateSystemState();
        } else {
            alert(`請在${sideText}區 M2 欄位至少填寫一個數值`);
        }
    }

    // 3. 安置 (Placement)
    function addPlacement(side) {
        let inputId = `place_input_${side}`;
        let input = document.getElementById(inputId);
        let level = parseInt(input.value);

        if (!level || level <= 0) return alert("請輸入正確等級");

        if (side === 'L') {
            state.leftPoints += level;
            addLog("安置 (左)", `左區接收安置/溢出 等級 ${level}`, `<span class="text-primary">+${level} 左</span>`, 0);
        } else {
            state.rightPoints += level;
            addLog("安置 (右)", `右區接收安置/溢出 等級 ${level}`, `<span class="text-warning-emphasis">+${level} 右</span>`, 0);
        }

        input.value = "";
        updateSystemState();
    }

    // 4. M3 對碰 (Global)
    function executeMatch() {
        if (state.leftPoints === 0 || state.rightPoints === 0) {
            return alert("左右兩區都需要有積分才能進行對碰！");
        }

        let pLevel = document.getElementById("p_level").value;
        let info = getRankInfo(pLevel);

        let t = Math.min(state.leftPoints, state.rightPoints);
        let bonus = 73.8 * t * info.m3;

        let oldLeft = state.leftPoints;
        let oldRight = state.rightPoints;
        
        state.leftPoints -= t;
        state.rightPoints -= t;
        state.totalCoins += bonus;

        addLog("M3 對碰", 
            `執行對碰 (t=${t})。比例 ${Math.round(info.m3*100)}%。<br><small>左: ${oldLeft}→${state.leftPoints} / 右: ${oldRight}→${state.rightPoints}</small>`, 
            `<span class="text-danger fw-bold">-${t} 雙邊</span>`, 
            bonus
        );

        updateSystemState();
    }

    // 重置
    function resetSystem() {
        if(!confirm("確定要清空所有紀錄與收益嗎？")) return;
        state = { totalCoins: 0, leftPoints: 0, rightPoints: 0, logCount: 0, hasCelebratedS: false };
        document.getElementById("log_body").innerHTML = "";
        document.getElementById("p_level").value = 1;
        updateSystemState();
    }

</script>
